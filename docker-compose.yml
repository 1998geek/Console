# 文件名: docker-compose.yml
services:
  # 1. 后端服务 (FastAPI)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_portal_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app  # <--- 加上这行，代码热更新

  # 2. 前端服务 (Streamlit)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_portal_frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    command: streamlit run main.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./frontend:/app # <--- 加上这行，代码热更新

  # 3. 中间件 (Redis)
  redis:
    image: redis:alpine
    container_name: ai_portal_redis
    ports:
      - "6379:6379"